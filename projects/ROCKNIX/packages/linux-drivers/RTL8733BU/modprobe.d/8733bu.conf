# RTL8733BU (RK3566 devices that use this module, e.g. Miyoo Flip)
#
# rtw_ips_mode=0 is required for the USB WiFi+BT combo: IPS "card disable" would
# power down shared firmware and break Bluetooth when WiFi is soft-blocked.
# Full GPIO power-off is handled by rtl8733bu_power when both rfkill are blocked.
#
# Power-save matrix (module params; reboot after change):
#   Option A — max stability / lowest risk of hotspot stalls:
#     rtw_power_mgnt=0 rtw_lps_level=0   (WiFi radio power save mostly off)
#   Option B — balanced (default below): moderate savings, good hotspot behavior:
#     rtw_power_mgnt=1 rtw_lps_level=1
#   Option C — more aggressive (previous default rtw_power_mgnt=2): can cause
#     intermittent HTTPS/timeouts on some hotspots; not recommended here.
#
# The driver tracks the Linux 7.1 port at
# Awesome-Embedded-Learning-Studio/rtl8733bu-linux-driver, which carries its own
# build-time choices in ccflags-y.  Two differences from the old patched build
# matter here -- WOWLAN is now compiled in and IEEE80211W/PMF is on, which is
# what provides WPA3/SAE without a local patch.
#
# Of the eight old local patches, two are carried again in patches/ because the
# defects they fix are still present upstream, and neither touches power save:
#   001-usb-shutdown-hook-6.8   usb_register_driver() overwrites driver.shutdown,
#                               so rtw_dev_shutdown() never ran at poweroff.
#   002-suspend-resume-hardening  500 ms bound on the bips_processing wait that
#                               hung suspend, plus a reset_resume that clears the
#                               WoWLAN flags so a bus reset forces full reinit.
#
# The options below are runtime overrides and still take effect; changing them
# needs only a reboot, not a rebuild.
#
options 8733bu rtw_ips_mode=0 rtw_power_mgnt=1 rtw_lps_level=1 rtw_lps_chk_by_tp=1 rtw_enusbss=0
