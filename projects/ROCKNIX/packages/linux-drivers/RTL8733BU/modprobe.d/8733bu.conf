# RTL8733BU (RK3566 devices that use this module, e.g. Miyoo Flip)
#
# rtw_ips_mode=0 is required for the USB WiFi+BT combo: IPS "card disable" would
# power down shared firmware and break Bluetooth when WiFi is soft-blocked.
# Full GPIO power-off is handled by rtl8733bu_power when both rfkill are blocked.
#
# Power-save matrix (module params; reboot after change):
#   Option A — max stability / lowest risk of hotspot stalls:
#     rtw_power_mgnt=0 rtw_lps_level=0   (WiFi radio power save mostly off)
#   Option B — balanced (default below): moderate savings, good hotspot behavior:
#     rtw_power_mgnt=1 rtw_lps_level=1
#   Option C — more aggressive (previous default rtw_power_mgnt=2): can cause
#     intermittent HTTPS/timeouts on some hotspots; not recommended here.
#
# The driver tracks the Linux 7.1 port at
# Awesome-Embedded-Learning-Studio/rtl8733bu-linux-driver (since renamed to
# Charliechen114514/rtl8733bu-linux-driver), which carries its own build-time
# choices in ccflags-y.  WOWLAN is now compiled in and IEEE80211W/PMF is on.
#
# PMF being on is not the same thing as SAE working, which is what switching to
# this tree assumed. It does not carry the WPA3 fixes, and neither does the
# wirenboard tree it came from nor any of the other rtl8733bu forks -- they all
# still have the same vendor code. 006 puts those fixes back.
#
# Of the eight old local patches, two are carried again in patches/ because the
# defects they fix are still present upstream, and neither touches power save:
#   001-usb-shutdown-hook-6.8   usb_register_driver() overwrites driver.shutdown,
#                               so rtw_dev_shutdown() never ran at poweroff.
#   002-suspend-resume-hardening  500 ms bound on the bips_processing wait that
#                               hung suspend, plus a reset_resume that clears the
#                               WoWLAN flags so a bus reset forces full reinit.
#
# Two more are new rather than carried over, both about the same double release
# of a BSS, one per path that reaches it:
#   003-shutdown-cfg80211-disconnect-race  follows from 001: once the shutdown
#                               hook actually ran, the driver's own disconnect
#                               raced the one userspace had already queued and
#                               cfg80211 released the same BSS twice, panicking
#                               in cfg80211_put_bss() so the board rebooted
#                               instead of powering off.
#   004-userspace-disconnect-bss-double-release  the same fault without any
#                               poweroff: an ordinary `nmcli device disconnect`
#                               panicked the board, because the driver reports
#                               the disconnect from two paths and cfg80211
#                               releases the BSSes on each without checking.
#                               Indicate only while cfg80211 still thinks it is
#                               connected, so whichever path is first does the
#                               teardown. Suppressing one path instead, as this
#                               patch first did, left wdev->connected set after
#                               a disconnect that leaves the interface up, which
#                               makes the kernel refuse iwd's randomized scans
#                               and blocks reconnection. Also drops a valid_links
#                               test that is always false for non-MLO, which had
#                               disabled the current_bss teardown at unregister.
#
# The fifth is a build option rather than a defect fix:
#   005-drop-concurrent-mode    the fork enables CONFIG_CONCURRENT_MODE, which
#                               registers a second virtual interface, so a
#                               single radio came up as wlan0 and wlan1.
#                               Nothing in ROCKNIX runs two interfaces at once,
#                               while wifictl and rocknix-info both assume the
#                               first wlan* is the one in use -- and NM would
#                               associate on wlan1, so `wifictl pin` pinned
#                               nothing before suspend and resume could land on
#                               a different network.
#
# The sixth restores work that predates the move to the 7.1 tree:
#   006-restore-sae-wpa3-fixes  five SAE defects, the important one being that
#                               STA mode records the external-auth result and
#                               never starts the association, so a WPA3 connect
#                               completes the exchange and then stalls. Carried
#                               locally before the tree switch, dropped with the
#                               other local patches, and still absent upstream.
#
# The options below are runtime overrides and still take effect; changing them
# needs only a reboot, not a rebuild.
#
options 8733bu rtw_ips_mode=0 rtw_power_mgnt=1 rtw_lps_level=1 rtw_lps_chk_by_tp=1 rtw_enusbss=0
